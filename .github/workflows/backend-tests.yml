name: Backend Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Run Backend Tests
    runs-on: ubuntu-latest

    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/it_service_desk_test?schema=public
      JWT_SECRET: github-actions-test-secret-not-for-production

    services:
      postgres:
        image: postgres:18

        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: it_service_desk_test

        ports:
          - 5432:5432

        options: >-
          --health-cmd "pg_isready -U postgres -d it_service_desk_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
        - name: Checkout repository
          uses: actions/checkout@v4

        - name: Setup Node.js
          uses: actions/setup-node@v4
          with:
            node-version: '22'
            cache: 'npm'
            cache-dependency-path: server/package-lock.json

        - name: Install server dependencies
          working-directory: ./server
          run: npm ci

        - name: Generate Prisma Client
          working-directory: ./server
          run: npx prisma generate

        - name: Apply database migrations
          working-directory: ./server
          run: npx prisma migrate deploy

        - name: Run backend integration tests
          working-directory: ./server
          run: npm test -- --run